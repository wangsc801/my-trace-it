spring.application.name=my-trace-it

# --- Datasource (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/my_trace_it}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT ---
# Secret must be at least 32 bytes for HS256. Override via JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:my-trace-it-dev-secret-change-me-please-2026}
app.jwt.expiry-seconds=${JWT_EXPIRY_SECONDS:86400}

# --- Server ---
server.port=${PORT:8080}