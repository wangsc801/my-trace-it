server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 客户端路由回退：非资源路径一律落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的静态资源可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}