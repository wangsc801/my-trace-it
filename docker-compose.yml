services:
  db:
    image: postgres:16.2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_trace_it}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 不对外发布端口：backend 在 Docker 网络内以 db:5432 访问，宿主 5432 常被本机
    # PostgreSQL 占用。若需在宿主直连，用 docker compose exec db psql ...。

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-my_trace_it}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-my-trace-it-docker-secret-change-me-please-2026}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 或命令行设置 ADMIN_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      PORT: "8832"
    ports:
      - "8832:8832"

  frontend:
    build:
      context: ./frontend
      # 默认同源（空），nginx 在同一端口把 /api 反代到后端。
      # 仅当 /api 反代不可用、需直连后端时才设置具体后端地址。
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8833:80"

volumes:
  pgdata: